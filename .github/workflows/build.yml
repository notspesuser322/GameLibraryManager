name: Construir ejecutable

# Se ejecuta en cada push: así el ejecutable siempre está al día sin hacer nada.
# También se puede lanzar a mano desde la pestaña Actions.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar la batería de pruebas
        run: npm test

  windows:
    name: Ejecutable de Windows
    needs: pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Herramientas de empaquetado
        run: npm install --no-save --no-audit --no-fund esbuild postject

      - name: Construir Ludoteca.exe
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          Write-Host "Binario de Node: $node"
          node scripts/build-sea.mjs --runtime "$node" --out "dist/Ludoteca.exe"

      - name: Comprobar el ejecutable
        shell: pwsh
        run: |
          $version = & "dist/Ludoteca.exe" --version
          Write-Host "Respuesta: $version"
          if ($version -notmatch 'ludoteca') { throw 'El ejecutable no responde a --version' }
          $size = (Get-Item "dist/Ludoteca.exe").Length / 1MB
          Write-Host ("Tamaño: {0:N1} MB" -f $size)

      - name: Prueba de arranque real
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/Ludoteca.exe" `
            -ArgumentList @('--port', '4399', '--host', '127.0.0.1', '--data-dir', "$env:TEMP\ludoteca-ci", '--demo', '--no-open') `
            -PassThru -RedirectStandardOutput "$env:TEMP\ludoteca.log" -RedirectStandardError "$env:TEMP\ludoteca.err"
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:4399/api/health' -TimeoutSec 3
                if ($health.ok) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) {
              Get-Content "$env:TEMP\ludoteca.log", "$env:TEMP\ludoteca.err" -ErrorAction SilentlyContinue | Write-Host
              throw 'El servidor del ejecutable no respondió'
            }
            $state = Invoke-RestMethod -Uri 'http://127.0.0.1:4399/api/state' -TimeoutSec 10
            Write-Host ("Correcto: {0} juegos · empaquetado={1} · datos en {2}" -f $state.games.Count, $health.packaged, $state.app.dataDir)
            if ($state.games.Count -lt 10) { throw 'La biblioteca de ejemplo no cargó' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Preparar el paquete de descarga
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Ludoteca | Out-Null
          Move-Item -Force dist/Ludoteca.exe dist/Ludoteca/Ludoteca.exe
          Copy-Item LEEME.txt dist/Ludoteca/LEEME.txt
          Copy-Item README.md dist/Ludoteca/LEEME-tecnico.md -ErrorAction SilentlyContinue
          Copy-Item LICENSE dist/Ludoteca/ -ErrorAction SilentlyContinue
          if (Test-Path docs) { Copy-Item -Recurse docs dist/Ludoteca/docs }
          New-Item -ItemType Directory -Force -Path dist/salida | Out-Null
          Compress-Archive -Path dist/Ludoteca/* -DestinationPath dist/salida/Ludoteca-windows.zip -Force
          Get-ChildItem dist/Ludoteca | Format-Table Name, Length

      - name: Guardar el ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: ludoteca-windows
          path: dist/salida/Ludoteca-windows.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publicar en la sección Releases (solo etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/salida/Ludoteca-windows.zip
          name: Ludoteca ${{ github.ref_name }}
          body: |
            Ejecutable único para Windows: descarga el ZIP, descomprímelo y abre
            `Ludoteca.exe`. No hace falta instalar nada más.
          generate_release_notes: true

      - name: Resumen
        shell: pwsh
        run: |
          @"
          ### Ludoteca para Windows
          - Archivo: ``Ludoteca-windows.zip`` (artefacto **ludoteca-windows**)
          - Contenido: ``Ludoteca.exe`` + ``LEEME.txt``
          - Uso: descomprimir y abrir ``Ludoteca.exe``
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  linux:
    name: Ejecutable de Linux
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Herramientas de empaquetado
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils && npm install --no-save --no-audit --no-fund esbuild postject

      - name: Construir el ejecutable
        run: node scripts/build-sea.mjs --runtime "$(command -v node)" --out dist/ludoteca

      - name: Comprobar el ejecutable
        run: |
          dist/ludoteca --version
          dist/ludoteca --port 4399 --host 127.0.0.1 --data-dir /tmp/ludoteca-ci --demo --no-open &
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf http://127.0.0.1:4399/api/health >/dev/null; then break; fi
          done
          curl -sf http://127.0.0.1:4399/api/health | tee /tmp/health.json
          curl -sf http://127.0.0.1:4399/api/state | head -c 200
          ls -la dist/ludoteca

      - name: Guardar el ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: ludoteca-linux
          path: dist/ludoteca
          if-no-files-found: error
          retention-days: 90
