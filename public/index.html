<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ludoteca — tu biblioteca de juegos</title>
<meta name="description" content="Gestor local de biblioteca de juegos: unifica tus launchers, mide tu tiempo de juego y organiza tu colección." />
<meta name="color-scheme" content="dark light" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237c5cff'/%3E%3Cpath d='M20 44V20h9.5c6.4 0 10.5 3.3 10.5 8.6 0 3.9-2 6.7-5.5 8l6.5 7.4h-6.3l-5.6-6.6H25V44h-5zm5-11h4.2c3.4 0 5.5-1.5 5.5-4.2 0-2.7-2-4.2-5.5-4.2H25V33z' fill='white'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body data-view="library" data-background="aurora">
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

  <div class="app" id="app">
    <!-- ------------------------------------------------------------ sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="26" height="26"><path d="M7 25V7h8.6c5.8 0 9.4 2.9 9.4 7.7 0 3.5-1.8 6-5 7.2L25.6 25h-5.7l-4.9-5.9H12V25H7zm5-9.9h3.7c3 0 4.9-1.3 4.9-3.7s-1.9-3.7-4.9-3.7H12v7.4z" fill="currentColor"/></svg>
        </div>
        <div class="brand-text">
          <strong>Ludoteca</strong>
          <span id="brand-sub">biblioteca local</span>
        </div>
        <button class="icon-btn sidebar-toggle" id="btn-collapse" title="Contraer panel" aria-label="Contraer panel">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item" data-view="library">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 5h6v14H4zM14 5h6v14h-6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span>Biblioteca</span><em id="count-all">0</em>
        </button>
        <button class="nav-item" data-view="activity">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 18l4-6 3 3 4-8 5 11z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span>Actividad</span>
        </button>
        <button class="nav-item" data-view="stats">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 20V10m7 10V5m7 15v-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Estadísticas</span>
        </button>
        <button class="nav-item" data-view="scan">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3v4m0 10v4M3 12h4m10 0h4M6.3 6.3l2.8 2.8m5.8 5.8l2.8 2.8m0-11.4l-2.8 2.8m-5.8 5.8l-2.8 2.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>Buscar juegos</span>
        </button>
        <button class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-2.9 1.2v.2a2 2 0 11-4 0v-.1a1.7 1.7 0 00-2.9-1.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.7 1.7 0 003 15.4H2.9a2 2 0 110-4H3a1.7 1.7 0 001.3-2.9l-.1-.1a2 2 0 112.8-2.8l.1.1A1.7 1.7 0 0010 4.5V4.4a2 2 0 114 0v.2a1.7 1.7 0 002.9 1.2l.1-.1a2 2 0 112.8 2.8l-.1.1A1.7 1.7 0 0021 11.5h.1a2 2 0 110 4H21a1.7 1.7 0 00-1.6 1.2z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
          <span>Ajustes</span>
        </button>
      </nav>

      <div class="sidebar-scroll">
        <section class="side-section" id="side-running" hidden>
          <h3>Jugando ahora</h3>
          <div id="running-list" class="running-list"></div>
        </section>

        <section class="side-section">
          <header><h3>Estado</h3></header>
          <div id="side-statuses" class="side-list"></div>
        </section>

        <section class="side-section">
          <header><h3>Plataformas</h3></header>
          <div id="side-platforms" class="side-list"></div>
        </section>

        <section class="side-section">
          <header><h3>Etiquetas</h3></header>
          <div id="side-tags" class="tag-cloud"></div>
        </section>
      </div>

      <div class="sidebar-foot">
        <div class="storage-line"><span id="foot-summary">—</span></div>
        <div class="foot-actions">
          <button class="btn small" id="btn-quick-scan" title="Buscar juegos instalados">Escanear</button>
          <button class="btn small" id="btn-add-game" title="Agregar juego manualmente">Agregar</button>
        </div>
      </div>
    </aside>

    <!-- --------------------------------------------------------------- main -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="btn-menu" aria-label="Menú">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>

        <div class="search">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M11 18a7 7 0 100-14 7 7 0 000 14zm5.5-1.5L21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="search-input" type="search" placeholder="Buscar por nombre, etiqueta, carpeta…  (Ctrl+K)" autocomplete="off" spellcheck="false" />
        </div>

        <div class="topbar-actions">
          <div class="live-strip" id="live-strip" hidden></div>
          <button class="btn ghost" id="btn-view-mode" title="Cambiar vista (grid / lista)"></button>
          <button class="btn ghost" id="btn-refresh" title="Recargar datos">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M20 11a8 8 0 10-3 6.2M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="btn primary" id="btn-scan">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 3v4m0 10v4M3 12h4m10 0h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            Buscar juegos
          </button>
        </div>
      </header>

      <section class="view" id="view"></section>
    </main>
  </div>

  <div class="ctx-menu" id="ctx-menu" hidden></div>
  <div class="modal-root" id="modal-root" hidden></div>
  <div class="palette" id="palette" hidden></div>
  <div class="toasts" id="toasts"></div>
  <div class="drop-veil" id="drop-veil" hidden><span>Suelta la imagen para usarla como carátula</span></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
