# Construccion automatica de los ejecutables y de la pagina de descargas.
#
# COMO ACTIVARLO (una sola vez): este archivo se copia tal cual a
# .github/workflows/build.yml en la rama main. GitHub no permite crear archivos
# dentro de .github/workflows/ sin un permiso especial, por eso vive aqui.
#
#     mkdir -p .github/workflows
#     cp ci/build.yml .github/workflows/build.yml
#     git add .github/workflows/build.yml
#     git commit -m "Construccion automatica del ejecutable"
#     git push
#
# Que hace en cada push:
#   1. ejecuta la bateria de pruebas;
#   2. construye Ludoteca.exe (portable) y Ludoteca-Instalador.exe;
#   3. comprueba de verdad que el portable arranca y responde;
#   4. instala el programa con el instalador, comprueba accesos directos y
#      registro, lo abre, lo desinstala y verifica que no quede nada;
#   5. publica los dos archivos en Releases con su etiqueta (v1.1.0) y las notas
#      generadas a partir de los commits;
#   6. los deja tambien como artefactos descargables.
name: Construir ejecutable

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar la bateria de pruebas
        run: npm test

  windows:
    name: Ejecutable de Windows
    needs: pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Herramientas de empaquetado
        run: npm install --no-save --no-audit --no-fund esbuild postject

      - name: Version publicada
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "Version: $v"
          "numero=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Construir el portable y el instalador
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          Write-Host "Binario de Node: $node"
          node scripts/build-sea.mjs --modo portable  --runtime "$node" --out "dist/Ludoteca.exe"
          node scripts/build-sea.mjs --modo instalador --runtime "$node" --out "dist/Ludoteca-Instalador.exe"
          Get-ChildItem dist/*.exe | Format-Table Name, Length

      - name: Comprobar el portable
        shell: pwsh
        run: |
          $version = & "dist/Ludoteca.exe" --version
          Write-Host "Respuesta: $version"
          if ($version -notmatch 'ludoteca') { throw 'El ejecutable no responde a --version' }

          $process = Start-Process -FilePath "dist/Ludoteca.exe" `
            -ArgumentList @('--port', '4399', '--host', '127.0.0.1', '--data-dir', "$env:TEMP\ludoteca-ci", '--demo', '--no-open') `
            -PassThru -RedirectStandardOutput "$env:TEMP\ludoteca.log" -RedirectStandardError "$env:TEMP\ludoteca.err"
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:4399/api/health' -TimeoutSec 3
                if ($health.ok) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) {
              Get-Content "$env:TEMP\ludoteca.log", "$env:TEMP\ludoteca.err" -ErrorAction SilentlyContinue | Write-Host
              throw 'El servidor del ejecutable no respondio'
            }
            $state = Invoke-RestMethod -Uri 'http://127.0.0.1:4399/api/state' -TimeoutSec 10
            Write-Host ("Correcto: {0} juegos, empaquetado={1}" -f $state.games.Count, $health.packaged)
            if ($state.games.Count -lt 10) { throw 'La biblioteca de ejemplo no cargo' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Instalar, comprobar y desinstalar
        shell: pwsh
        run: |
          $programa = Join-Path $env:LOCALAPPDATA 'Programs\Ludoteca'
          $acceso   = Join-Path ([Environment]::GetFolderPath('Programs')) 'Ludoteca.lnk'
          $clave    = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Ludoteca'

          Write-Host '== Instalando en silencio =='
          $instalador = Start-Process -FilePath "dist/Ludoteca-Instalador.exe" -ArgumentList '--silent' -PassThru -Wait
          Start-Sleep -Seconds 3

          if (-not (Test-Path (Join-Path $programa 'Ludoteca.exe'))) { throw 'No se copio el programa' }
          Write-Host ("Programa instalado en {0}" -f $programa)

          if (-not (Test-Path $acceso)) { throw 'No se creo el acceso directo del menu Inicio' }
          Write-Host 'Acceso directo del menu Inicio: correcto'

          if (-not (Test-Path $clave)) { throw 'No se registro en Aplicaciones instaladas' }
          $registro = Get-ItemProperty $clave
          Write-Host ("Registro: {0} {1}" -f $registro.DisplayName, $registro.DisplayVersion)
          if ($registro.UninstallString -notmatch '--uninstall') { throw 'La orden de desinstalacion no es correcta' }

          Write-Host '== Abriendo el programa instalado =='
          $app = Start-Process -FilePath (Join-Path $programa 'Ludoteca.exe') `
            -ArgumentList @('--port', '4398', '--host', '127.0.0.1', '--data-dir', "$env:TEMP\ludoteca-instalada", '--demo', '--no-open') `
            -PassThru -RedirectStandardOutput "$env:TEMP\instalada.log" -RedirectStandardError "$env:TEMP\instalada.err"
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:4398/api/health' -TimeoutSec 3
                if ($health.ok) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) {
              Get-Content "$env:TEMP\instalada.log", "$env:TEMP\instalada.err" -ErrorAction SilentlyContinue | Write-Host
              throw 'La copia instalada no arranco'
            }
            Write-Host 'La copia instalada arranca y responde'
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }

          Write-Host '== Desinstalando =='
          Start-Process -FilePath (Join-Path $programa 'Ludoteca.exe') -ArgumentList '--uninstall', '--silent' -Wait
          Start-Sleep -Seconds 6

          if (Test-Path $acceso) { throw 'El acceso directo sigue ahi' }
          if (Test-Path $clave) { throw 'El registro sigue ahi' }
          if (Test-Path $programa) { throw 'La carpeta del programa sigue ahi' }
          Write-Host 'Desinstalacion limpia: sin accesos, sin registro y sin carpeta'

      - name: Preparar los archivos de descarga
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.numero }}'
          New-Item -ItemType Directory -Force -Path dist/Ludoteca | Out-Null
          Move-Item -Force dist/Ludoteca.exe dist/Ludoteca/Ludoteca.exe
          Copy-Item LEEME.txt dist/Ludoteca/LEEME.txt
          Copy-Item README.md dist/Ludoteca/LEEME-tecnico.md -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path dist/salida | Out-Null
          Compress-Archive -Path dist/Ludoteca/* -DestinationPath "dist/salida/Ludoteca-$version-portable.zip" -Force
          Move-Item -Force dist/Ludoteca-Instalador.exe "dist/salida/Ludoteca-$version-instalador.exe"
          Get-ChildItem dist/salida | Format-Table Name, @{Name='MB';Expression={[math]::Round($_.Length/1MB,1)}}

      - name: Guardar los artefactos
        uses: actions/upload-artifact@v4
        with:
          name: ludoteca-windows
          path: |
            dist/salida/Ludoteca-*-portable.zip
            dist/salida/Ludoteca-*-instalador.exe
          if-no-files-found: error
          retention-days: 90

      - name: Publicar en Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.numero }}
          name: Ludoteca ${{ steps.version.outputs.numero }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            ## Como se instala

            **Con instalador (recomendado).** Descarga
            `Ludoteca-${{ steps.version.outputs.numero }}-instalador.exe` y haz doble clic. Se instala
            en tu carpeta de usuario, crea los accesos directos en el menu Inicio y en el escritorio,
            y aparece en **Aplicaciones instaladas** para quitarlo cuando quieras. No pide permisos de
            administrador.

            **Sin instalarlo (portable).** Descarga `Ludoteca-${{ steps.version.outputs.numero }}-portable.zip`,
            descomprimelo y abre `Ludoteca.exe` desde donde lo tengas.

            Los dos incluyen lo mismo: el programa completo, sin necesidad de instalar Node ni nada mas.
            Tus datos se guardan en `%APPDATA%\Ludoteca`.

            Si Windows muestra el aviso azul de SmartScreen, pulsa **Mas informacion** y luego
            **Ejecutar de todas formas**: aparece porque no esta firmado con un certificado de pago.

            ## Cambios de esta version
          files: |
            dist/salida/Ludoteca-*-portable.zip
            dist/salida/Ludoteca-*-instalador.exe

      - name: Resumen
        if: always()
        shell: pwsh
        run: |
          @"
          ### Ludoteca ${{ steps.version.outputs.numero }} para Windows
          - **Instalador:** ``Ludoteca-${{ steps.version.outputs.numero }}-instalador.exe``
          - **Portable:** ``Ludoteca-${{ steps.version.outputs.numero }}-portable.zip``
          - Descarga: seccion **Releases** del repositorio, o artefacto ``ludoteca-windows``
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  linux:
    name: Ejecutable de Linux
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Herramientas de empaquetado
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils && npm install --no-save --no-audit --no-fund esbuild postject

      - name: Construir los ejecutables
        run: |
          node scripts/build-sea.mjs --modo portable  --runtime "$(command -v node)" --out dist/ludoteca
          node scripts/build-sea.mjs --modo instalador --runtime "$(command -v node)" --out dist/ludoteca-instalador

      - name: Comprobar el ejecutable portable
        run: |
          dist/ludoteca --version
          dist/ludoteca --port 4399 --host 127.0.0.1 --data-dir /tmp/ludoteca-ci --demo --no-open &
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf http://127.0.0.1:4399/api/health >/dev/null; then break; fi
          done
          curl -sf http://127.0.0.1:4399/api/health | tee /tmp/health.json
          node -e "const d=require('/tmp/health.json'); if(!d.ok) process.exit(1); console.log('interfaz y API correctas')"

      - name: Comprobar el instalador
        run: |
          dist/ludoteca-instalador --version
          if dist/ludoteca-instalador --silent; then
            echo "El instalador deberia avisar de que es para Windows" >&2
            exit 1
          fi
          echo "El instalador avisa correctamente en sistemas que no son Windows"

      - name: Guardar el ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: ludoteca-linux
          path: dist/ludoteca
          if-no-files-found: error
          retention-days: 90
